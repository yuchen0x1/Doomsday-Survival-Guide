[package]
name = "apocalypse-desktop"
version = "1.1.1"
description = "APOCALYPSE SURVIVAL 末日生存指南 - 桌面端（Tauri 2）"
authors = ["APOCALYPSE SURVIVAL"]
edition = "2021"

[lib]
name = "apocalypse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
