# APOCALYPSE SURVIVAL 本地开发环境
# 与 .env.example 保持一致：
#   DATABASE_URL=postgresql://survival:survival@localhost:5432/apocalypse_survival
services:
  postgres:
    image: postgres:16-alpine
    container_name: apocalypse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apocalypse_survival
      POSTGRES_USER: survival
      POSTGRES_PASSWORD: survival
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survival"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 可选：轻量数据库管理界面（http://localhost:8080）
  # 仅在显式启用时拉取镜像：docker compose --profile tools up -d adminer
  adminer:
    image: adminer:latest
    container_name: apocalypse-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
