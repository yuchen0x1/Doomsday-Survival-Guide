name: Legacy Web release package

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "要发布的版本标签，例如 v1.0.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version_tag }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.version_tag }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Validate release version
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag must match package version')"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate API types
        run: pnpm --filter @apocalypse/api prisma:generate
      - name: Validate
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          node --test scripts/verify-capacitor-template.cjs
      - name: Build web PWA
        run: pnpm build
      - name: Package web assets and checksum
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/apocalypse-survival-web-${RELEASE_TAG}.tar.gz" -C apps/web/dist .
          (cd release && sha256sum "apocalypse-survival-web-${RELEASE_TAG}.tar.gz" > SHA256SUMS)
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-release-${{ env.RELEASE_TAG }}
          retention-days: 14
          path: release/
