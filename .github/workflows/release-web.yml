name: Legacy Web release package

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "要发布的版本标签，例如 v1.0.1"
        required: true
        type: string
      publish_release:
        description: "确认后才创建 GitHub Release；默认只构建并上传 Actions 工件"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}
    steps:
      - name: Checkout requested main/tag ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Validate release version
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag must match package version')"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate API types
        run: pnpm --filter @apocalypse/api prisma:generate
      - name: Validate
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          node --test scripts/verify-capacitor-template.cjs
      - name: Build web PWA
        run: pnpm build
      - name: Package web assets and checksum
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/apocalypse-survival-web-${RELEASE_TAG}.tar.gz" -C apps/web/dist .
          (cd release && sha256sum "apocalypse-survival-web-${RELEASE_TAG}.tar.gz" > SHA256SUMS)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ env.RELEASE_TAG }}
          path: release/

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.version_tag }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-release-${{ env.RELEASE_TAG }}
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release/* --title "$RELEASE_TAG" --generate-notes
