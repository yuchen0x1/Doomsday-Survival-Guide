name: Legacy Web release package

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "要发布的版本标签，例如 v1.0.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version_tag }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version_tag }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Validate release version
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag must match package version')"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate API types
        run: pnpm --filter @apocalypse/api prisma:generate
      - name: Validate
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          node --test scripts/verify-capacitor-template.cjs
      - name: Build web PWA
        run: pnpm build
      - name: Package web assets and checksum
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/apocalypse-survival-web-${RELEASE_TAG}.tar.gz" -C apps/web/dist .
          (cd release && sha256sum "apocalypse-survival-web-${RELEASE_TAG}.tar.gz" > SHA256SUMS)
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-release-${{ env.RELEASE_TAG }}
          retention-days: 14
          path: release/
