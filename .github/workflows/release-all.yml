name: Three-platform release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "版本标签，例如 v1.1.1"
        required: true
        type: string
      publish_release:
        description: "三个平台全部构建成功后正式创建 Release"
        required: true
        default: false
        type: boolean
      android_only:
        description: "仅验证 Android，不创建 Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}

jobs:
  preflight:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Verify tag format
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tagged main commit
        id: source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/verify-release-versions.cjs

  web:
    needs: preflight
    if: ${{ !inputs.android_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: node scripts/verify-release-versions.cjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @apocalypse/api prisma:generate
      - name: Validate shared application
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          node --test scripts/verify-capacitor-template.cjs
          pnpm audit --prod --registry=https://registry.npmjs.org --audit-level=high
      - run: pnpm build
      - name: Package Web/PWA
        run: |
          mkdir release
          tar -czf "release/apocalypse-survival-web-${RELEASE_TAG}.tar.gz" -C apps/web/dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ env.RELEASE_TAG }}
          retention-days: 14
          path: release/*
          if-no-files-found: error

  windows:
    needs: preflight
    if: ${{ !inputs.android_only }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: node scripts/verify-release-versions.cjs
      - run: pnpm install --frozen-lockfile
      - name: Build Windows x64 installer
        run: pnpm --filter @apocalypse/desktop exec tauri build --ci --bundles nsis -- --locked
      - name: Collect installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          New-Item -ItemType Directory release | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination "release/apocalypse-survival-windows-x64-$env:RELEASE_TAG-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ env.RELEASE_TAG }}
          retention-days: 14
          path: release/*
          if-no-files-found: error

  android:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false
      - run: node scripts/verify-release-versions.cjs
      - run: pnpm install --frozen-lockfile
      - name: Build bundled frontend
        run: node scripts/build-native-web.cjs
      - run: pnpm --filter @apocalypse/mobile exec cap sync android
      - name: Build release APK
        run: |
          cd apps/mobile/android
          # Legacy tags contain CRLF; normalize only the wrapper before Linux execution.
          sed -i 's/\r$//' gradlew
          bash gradlew --no-daemon assembleRelease
      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS"
          trap 'rm -f "$RUNNER_TEMP/apocalypse-release.p12"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apocalypse-release.p12"
          mkdir release
          APK="release/apocalypse-survival-android-${RELEASE_TAG}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --v4-signing-enabled false --ks "$RUNNER_TEMP/apocalypse-release.p12" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD --out "$APK" apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/android-signature.txt"
          grep -Fx 'Signer #1 certificate SHA-256 digest: c842c487f8349c8e42ec13b8f1c08c8954f18199e10afb5312ce21db0a013449' "$RUNNER_TEMP/android-signature.txt"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/android-badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/android-badging.txt"; then exit 1; fi
          grep "package: name='local.survival.apocalypse'" "$RUNNER_TEMP/android-badging.txt"
          grep "versionName='${RELEASE_TAG#v}'" "$RUNNER_TEMP/android-badging.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ env.RELEASE_TAG }}
          retention-days: 14
          path: release/*
          if-no-files-found: error

  collect:
    needs: [preflight, web, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-${{ env.RELEASE_TAG }}"
          merge-multiple: true
          path: release
      - name: Verify and index packages
        run: |
          node scripts/release-metadata.cjs "$RELEASE_TAG" release
          (cd release && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          retention-days: 14
          path: release/*
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'push' || (inputs.publish_release && !inputs.android_only) }}
    needs: [preflight, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release
      - name: Upload draft, verify bytes, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          test "$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" "refs/tags/$RELEASE_TAG" | tail -n1 | cut -f1)" = "$SOURCE_COMMIT"
          notes="docs/releases/${RELEASE_TAG}.md"
          test -s "$notes"
          (cd release && sha256sum -c SHA256SUMS)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release or draft already exists. Verify the existing release, or review the draft and resume it manually."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "APOCALYPSE SURVIVAL $RELEASE_TAG" --notes-file "$notes"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir verify
          cmp release/SHA256SUMS verify/SHA256SUMS
          (cd verify && sha256sum -c SHA256SUMS)
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '.isDraft == false and (.assets | length == 5)' | grep -Fx true
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.immutable' | grep -Fx true
